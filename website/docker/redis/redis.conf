# ── Redis Configuration ───────────────────────────────────
bind 0.0.0.0
port 6379
daemonize no
protected-mode no

# ── Memory ────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistence ───────────────────────────────────────────
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ── Append Only ───────────────────────────────────────────
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Performance ───────────────────────────────────────────
tcp-backlog 511
tcp-keepalive 300
timeout 0

# ── Logging ───────────────────────────────────────────────
loglevel notice
