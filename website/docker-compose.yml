version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
    networks:
      - app

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.production
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
