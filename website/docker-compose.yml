version: "3.9"

services:
  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: carecompass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - carecompass

  # ── Next.js App ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carecompass-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - carecompass

  # ── Nginx (Reverse Proxy) ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: carecompass-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - carecompass

volumes:
  redis_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  carecompass:
    driver: bridge
